data:
  raw_dir: data/raw
  merged_path: data/processed/train_merged.parquet

split:
  train_end_day: 120.0
  val_end_day: 150.0

model:
  seed: 42
  early_stopping_rounds: 100
  min_category_count: 100
  params:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 64
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 1.0
    metric: average_precision

evaluation:
  budgets: [0.01, 0.05]

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: fraud-ieee-cis
  registered_model: fraud-lgbm
