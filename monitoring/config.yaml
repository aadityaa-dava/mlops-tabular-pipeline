export_dir: artifacts/champion
data_path: data/processed/train_merged.parquet
report_path: reports/drift_report.json
top_n_features: 10
reference:
  start_day: 0
  end_day: 120
  sample_rows: 100000
  seed: 0
current:
  sample_rows: 50000
  seed: 3
null_check:
  sample_rows: 50000
  seeds: [1, 2]
windows:
  - {name: "train days 0-30 (in reference)", start_day: 0, end_day: 30, calibrate: true}
  - {name: "train days 30-60 (in reference)", start_day: 30, end_day: 60, calibrate: true}
  - {name: "train days 60-90 (in reference)", start_day: 60, end_day: 90, calibrate: true}
  - {name: "train days 90-120 (in reference)", start_day: 90, end_day: 120, calibrate: true}
  - {name: "validation days 120-150", start_day: 120, end_day: 150}
  - {name: "test days 150-183 (features only)", start_day: 150, end_day: 184}
# Global rule, kept for comparison. Both were set after looking at the first run on this
# data, so a quiet result on these windows is by construction, not evidence.
thresholds:
  column_score: 0.2
  missing_rate_shift: 0.2
# Per-column rule: limit = max(floor, safety_factor * largest value the column showed in the
# windows marked calibrate). The factor and the floors are judgment calls. The calibration
# windows lie inside the reference sample, so the limits are somewhat optimistic.
calibration:
  safety_factor: 1.25
  score_floor: 0.05
  missing_shift_floor: 0.02
simulation:
  report_path: reports/drift_sensitivity.json
  seed: 7
  base_window: {name: "validation days 120-150", start_day: 120, end_day: 150}
  scale: {column: TransactionAmt, factors: [1.05, 1.1, 1.2, 1.5, 2.0]}
  mean_shift: {column: C13, std_multiples: [0.1, 0.25, 0.5, 1.0]}
  blank: {column: V258, fractions: [0.05, 0.1, 0.2, 0.3, 0.5]}
  new_category: {column: P_emaildomain, fractions: [0.05, 0.1, 0.2, 0.4]}
