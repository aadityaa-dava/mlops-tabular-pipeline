[project]
name = "fraud-monitoring"
version = "0.1.0"
description = "Drift monitoring in its own environment: Evidently 0.7 does not import under pandas 3."
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently==0.7.23",
    "pandas>=2.3,<3",
    "pyarrow",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false
