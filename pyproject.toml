[project]
name = "mlops-tabular-pipeline"
version = "0.1.0"
description = "End-to-end ML pipeline with MLOps: versioned data, tracked experiments, CI/CD, deployment, drift monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "mlflow>=3.0",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow<26",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
