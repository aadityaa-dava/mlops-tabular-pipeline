name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  monitoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install the monitoring environment (pandas 2)
        working-directory: monitoring
        run: uv sync --frozen --python 3.12 --managed-python
      - name: Monitoring tests
        working-directory: monitoring
        run: uv run pytest -q

  build-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image and load it locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fraud-api:ci
      - name: Start the container and check health
        run: |
          docker run -d --name fraud-api -p 8000:8000 fraud-api:ci
          for i in $(seq 1 12); do
            sleep 5
            status=$(docker inspect --format '{{.State.Health.Status}}' fraud-api)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
          done
          docker logs fraud-api
          exit 1
      - name: Score a request through the container
        run: |
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"transactions":[{"TransactionAmt":59.0,"ProductCD":"W"}]}'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag fraud-api:ci "$IMAGE:${GITHUB_SHA}"
          docker tag fraud-api:ci "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
